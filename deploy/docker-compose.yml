# ============================================================
# 售后自助故障诊断系统 - 一键部署编排
# 启动: docker compose up -d
# 初始化管理员: docker compose run --rm init
# 停止: docker compose down
# 日志: docker compose logs -f backend
#
# 注意：backend / frontend 的构建上下文是**仓库根目录**（`..`），
#       这样 requirements.txt、deploy/scripts/init_admin.py、
#       deploy/frontend-nginx.conf 只有一份，不在子目录里复制。
#       Dockerfile 里的 COPY 路径都相对仓库根书写。
# ============================================================

services:
  # -------------------- 数据库 --------------------
  db:
    image: postgres:15-alpine
    container_name: fault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置，请先 cp .env.example .env}
      POSTGRES_DB: ${DB_NAME:-fault_db}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fault} -d ${DB_NAME:-fault_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 资源上限：4 核 8G 单机上 db 2.5 核 / backend 1 核 / nginx 0.5 / frontend 0.5。
    # 压测实测（100 并发、5 万故障 + 50 万日志、混合读写、10 分钟）：
    #   db 2 核 → CPU 打满 204%，P95 590ms（瓶颈）；db 2.5 核 → P95 513ms，吞吐 245 req/s。
    #   db 内存峰值约 300MiB（限 1GiB）；backend 内存峰值约 105MiB（限 512MiB）。
    #   shared_buffers 保持默认 128MB：调到 384MB 实测无收益（P95 401→413ms），
    #   数据主要靠 OS page cache 缓存，shared_buffers 加大会挤压 page cache。
    # 结论：db 是唯一硬瓶颈。要提高并发上限，先给 db 加核，backend 加核收益很小
    # （实测 1 核→2 核 P95 反而从 349ms 劣化到 590ms，核被抢走还不如留给 db）。
    mem_limit: 1g
    cpus: 2.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - fault-net

  # -------------------- 后端 API --------------------
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      # 构建容器不读宿主机的 pip/npm 配置，源必须显式传进去，
      # 否则 pip 连 pypi.org、npm 连 registry.npmjs.org，国内会长时间卡住
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
        # 与下面的 cpus 联动：1 核配 1 worker 最快（详见 Dockerfile 里的压测数据）
        UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    container_name: fault-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-fault}:${DB_PASSWORD}@db:5432/${DB_NAME:-fault_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置，请用 openssl rand -hex 32 生成}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      # 连接池。每个 worker 一套池，合计上限 = (DB_POOL_SIZE + DB_MAX_OVERFLOW) × workers。
      # 默认 20+25=45 个/worker，当前 1 个 worker 共 45 连接，低于 PG 的 max_connections(100)。
      # 扩 worker 时要同步减小这两项，否则池没满库先满。
      # 压测（TC-71，100 并发）实测：原 5+10=15/worker 会打满，
      # 请求在池上干等 30s 后抛 QueuePool TimeoutError，P95 恶化到 691ms。
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-25}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      # 控制 /api/docs 与 /api/openapi.json；默认关，本地调试在 .env 里设 true
      DEBUG: ${DEBUG:-false}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 容器以 uid 10001 运行，而这个目录是**宿主机挂载**——镜像里的 chown
      # 会被挂载点覆盖，最终属主取决于宿主机上那个目录是谁建的。
      # 属主不对时上传会失败（真机出过一次：PermissionError Errno 13，报 500）。
      # 起服前务必执行一次（幂等，可重复跑）：
      #   sudo ./scripts/prepare-storage.sh
      - ./data/uploads:/data/uploads
    # 资源上限：4 核机器上 backend 1 核（db 2.5 / nginx 0.5 / frontend 0.5）。
    # 压测实测（100 并发、10 分钟，见 05-评估审查/12-性能压测报告.md）：
    #   backend 1 核 = CPU 打满，但请求时间主要耗在等 db，不是自身算力不足。
    #   给它 2 核实测 P95 从 513ms 劣化到 590ms（抢走的核还不如留给 db），
    #   压到 0.5 核更差（P95 975ms），所以 1 核是最优点。
    #   内存：backend 峰值约 105MiB（限 512MiB），余量充足。
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 后端需提供 /api/health（只查 DB 连通性，不查业务）
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - fault-net

  # -------------------- 前端静态站 --------------------
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: /api
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.25-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: fault-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    # 静态站与反代几乎不吃 CPU，0.25 核足够（压测 250 req/s 实测 0% CPU）
    cpus: 0.25
    networks:
      - fault-net

  # -------------------- Nginx 统一入口 --------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: fault-nginx
    restart: unless-stopped
    environment:
      # 访问日志用本地时间；不设就是 UTC，排查时和后端日志的 +08:00 差 8 小时
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "80:80"
      # 配好证书后再开放 443（见 deploy/nginx-https.conf.example）
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/uploads:/data/uploads:ro
      # 启用 HTTPS 时取消下一行注释，并把证书放到 ./certs/
      # - ./certs:/etc/nginx/certs:ro
      # - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    # 静态站与反代几乎不吃 CPU，0.25 核足够（压测 250 req/s 实测 0% CPU）
    cpus: 0.25
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      - fault-net

  # -------------------- 一次性任务：初始化管理员 --------------------
  # 用法: docker compose run --rm init
  # 重置密码: docker compose run --rm init --reset-password
  #
  # 脚本已 COPY 进镜像（/app/scripts/init_admin.py）；
  # 这里再挂一份只读覆盖，改了脚本不必重建镜像。
  init:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      # 与 backend 保持同一套构建参数，避免两边镜像不一致
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    profiles: ["init"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-fault}:${DB_PASSWORD}@db:5432/${DB_NAME:-fault_db}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
      ADMIN_REAL_NAME: ${ADMIN_REAL_NAME:-系统管理员}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./scripts:/app/scripts:ro
    entrypoint: ["python", "/app/scripts/init_admin.py"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fault-net

  # 数据库迁移: docker compose run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    profiles: ["migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-fault}:${DB_PASSWORD}@db:5432/${DB_NAME:-fault_db}
      MIGRATION_DIR: /app/migrations
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./migrations:/app/migrations:ro
    entrypoint: ["python", "/app/scripts/migrate.py"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fault-net

networks:
  fault-net:
    driver: bridge

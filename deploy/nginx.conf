# ============================================================
# 售后自助故障诊断系统 - 统一入口
# 挂载到 /etc/nginx/conf.d/default.conf（属于 http 上下文）
# 修订：v1.1 2026-10-20 —— 补 gzip、安全响应头、限流、413/429 JSON 化
# ============================================================

# 未命中日志上报限流：单 IP 每分钟 30 次（与 API 契约 §4 一致）
limit_req_zone $binary_remote_addr zone=querylog:10m rate=30r/m;
# 登录限流：单 IP 每分钟 10 次（burst 5），挡住暴力破解；429 返回契约 §7 的 RATE_LIMITED
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# 公开工单提交限流：单 IP 每分钟 10 次（burst 3），防脚本刷单污染工单量与积压指标
limit_req_zone $binary_remote_addr zone=tickets:10m rate=10r/m;
limit_req_status 429;

# 访问日志格式：带上 request_id 与上游耗时，才能和后端 JSON 日志按同一个 id
# 把一次请求的两段串起来排查。刻意不记 $request_body —— 里面有客户手机号和密码。
log_format fault_main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" rid=$request_id '
                      'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    # 网关上限略高于后端 20MB，给 multipart 头留开销；
    # 真正的 20MB 判定由后端返回 413 + JSON
    client_max_body_size 21M;

    access_log /var/log/nginx/access.log fault_main;

    # ---------- 上游动态解析 ----------
    # Docker 内置 DNS。容器重建后 IP 会变，若 proxy_pass 直接写主机名，
    # nginx 只在启动时解析一次，重建后就会一直 502，直到重启 nginx。
    # 配合下面各 location 里的变量写法，按 valid 周期重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    # 默认 off 会让所有 proxy_pass 响应不压缩，本配置 100% 走代理，必须显式打开
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml text/xml image/svg+xml;

    # ---------- 前端静态资源（由 frontend 容器的 nginx 承载） ----------
    # SPA 的 history 路由回退需在 frontend 容器内配置，
    # 参考 deploy/frontend-nginx.conf，否则 /admin/faults/edit/1 刷新会 404。
    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 request_id：后端会优先沿用，实现前后端日志同号
        proxy_set_header X-Request-ID $request_id;
    }

    # ---------- 未命中日志上报（限流） ----------
    location = /api/query-logs {
        limit_req zone=querylog burst=5 nodelay;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 request_id：后端会优先沿用，实现前后端日志同号
        proxy_set_header X-Request-ID $request_id;
    }

    # ---------- 工单提交（限流，防刷单） ----------
    location = /api/tickets {
        limit_req zone=tickets burst=3 nodelay;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 request_id：后端会优先沿用，实现前后端日志同号
        proxy_set_header X-Request-ID $request_id;
    }

    # ---------- 登录（限流，防暴力破解） ----------
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 request_id：后端会优先沿用，实现前后端日志同号
        proxy_set_header X-Request-ID $request_id;
    }

    # ---------- 后端 API ----------
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 request_id：后端会优先沿用，实现前后端日志同号
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------- 上传附件直出 ----------
    # 先拦截可执行后缀（正则 location 优先级高于前缀匹配）
    location ~* ^/uploads/.*\.(php|py|sh|jsp|asp|cgi)$ {
        return 403;
    }

    location /uploads/ {
        alias /data/uploads/;
        # 用 add_header 单独控制缓存；不要同时写 expires，否则会发出两个 Cache-Control
        add_header Cache-Control "public, max-age=2592000, immutable";
        # location 内出现 add_header 会覆盖 server 级配置，三个安全头需重复声明
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---------- 健康检查（容器 healthcheck 依赖） ----------
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- 错误响应 JSON 化（前端可统一解析） ----------
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"detail":"文件超过 20MB 限制","code":"UPLOAD_TOO_LARGE"}';
    }

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"操作过于频繁，请稍后再试","code":"RATE_LIMITED"}';
    }

    # 后端未就绪时的兜底提示（避免直接抛 nginx 默认页）
    error_page 502 503 504 = @upstream_down;
    location @upstream_down {
        default_type application/json;
        return 503 '{"detail":"服务暂时不可用，请稍后重试","code":"SERVICE_UNAVAILABLE"}';
    }
}

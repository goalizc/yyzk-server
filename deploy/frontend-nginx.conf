# ============================================================
# 前端容器内 Nginx 配置（frontend/Dockerfile 中 COPY 到
#   /etc/nginx/conf.d/default.conf）
# 作用：SPA history 路由回退 + 静态资源缓存策略
# 缺失此配置时，刷新 /admin/faults/edit/1 会 404
# ============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的构建产物可长缓存。
    # 只写 add_header，不要同时用 expires：两者都会发 Cache-Control，响应里会出现两个头
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存，否则发版后用户拿到旧壳
    # 只保留一个 Cache-Control 头：expires 与 add_header 同时写会重复
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 路由回退：找不到文件就交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
